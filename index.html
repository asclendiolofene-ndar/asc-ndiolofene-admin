<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Administration – ASC Le Ndiolofène</title>
<style>
:root{--g:#17803a;--d:#0d4a22;--l:#7cc65a;--bg:#f3f8f1;--ink:#10231a;--m:#4b6455;--line:#cfe0cb;--red:#b3261e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{background:var(--d);color:#fff;padding:.7rem 1rem;display:flex;justify-content:space-between;align-items:center;gap:.8rem}
header b{font-size:1.05rem}
header small{display:block;color:#bfe2b3}
main{max-width:760px;margin:auto;padding:1rem}
h1,h2{margin:.2rem 0 .8rem}
.card{background:#fff;border:1px solid var(--line);border-radius:8px;padding:1rem;margin-bottom:1rem}
label{display:block;font-weight:600;margin:.8rem 0 .25rem}
input,select,textarea{width:100%;font:inherit;padding:.65rem;border:1px solid var(--m);border-radius:6px;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin-right:.5rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1rem}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:.6rem 1.1rem;background:var(--g);color:#fff;cursor:pointer}
button.alt{background:#e2eedf;color:var(--d)}
button.danger{background:#fbe4e2;color:var(--red)}
button:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:3px solid var(--l);outline-offset:2px}
.item{border-top:1px solid var(--line);padding:.8rem 0}
.item:first-child{border-top:0}
.item h3{margin:0 0 .2rem;font-size:1.05rem}
.tag{display:inline-block;font-size:.8rem;font-weight:600;border-radius:4px;padding:.05rem .45rem;margin-right:.4rem;background:#e2eedf;color:var(--d)}
.tag.pub{background:var(--l);color:#0b2a14}
.muted{color:var(--m)}
#msg{position:sticky;top:0;z-index:5;margin:0 0 1rem;padding:.7rem 1rem;border-radius:6px;font-weight:600;display:none}
#msg.ok{display:block;background:#dff3d8;color:var(--d)}
#msg.err{display:block;background:#fbe4e2;color:var(--red)}
.empty{border:2px dashed var(--line);border-radius:8px;padding:1.2rem;color:var(--m)}
img.cover{max-width:100%;max-height:140px;border-radius:6px;margin-top:.5rem}
</style>
</head>
<body>
<div id="app"><main><p>Chargement…</p></main></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Informations publiques du projet (la sécurité est assurée par les règles de la base).
var SUPABASE_URL = 'https://rwhkvhkkrqblncmltcqa.supabase.co';
var SUPABASE_KEY = 'sb_publishable_oIQTsNRlg9SwnwLIbPiHAA_WO6fmel3';
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
var app = document.getElementById('app');
var state = { session: null, profile: null, items: [], editing: null, formOpen: false };
var CATS = { actualite:'Actualité', communique:'Communiqué', match:'Match', culture:'Culture', social:'Social', interview:'Interview' };
var TYPES = { 'image/jpeg':'jpg', 'image/png':'png', 'image/webp':'webp' };

function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function slugify(s){ return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,60) || 'actualite'; }
function toast(text, isErr){ var m = document.getElementById('msg'); if(!m) return; m.textContent = text; m.className = isErr ? 'err' : 'ok'; m.scrollIntoView({block:'nearest'}); if(!isErr) setTimeout(function(){ m.className=''; }, 3500); }

// ---------- Connexion ----------
function showLogin(){
  app.innerHTML = '<main><div class="card"><h1>Administration</h1><p class="muted">ASC Le Ndiolofène. Réservé à l’équipe.</p>' +
    '<form id="lf"><label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="username" required>' +
    '<label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password" required>' +
    '<div class="row"><button type="submit" id="lb">Se connecter</button></div></form><p id="le" class="muted" role="alert"></p></div></main>';
  document.getElementById('lf').addEventListener('submit', async function(e){
    e.preventDefault();
    var b = document.getElementById('lb'), er = document.getElementById('le');
    b.disabled = true; er.textContent = '';
    var r = await sb.auth.signInWithPassword({ email: document.getElementById('em').value.trim(), password: document.getElementById('pw').value });
    b.disabled = false;
    if(r.error){
      var bad = r.error.status === 400 || r.error.status === 401 || r.error.status === 422;
      er.textContent = bad ? 'E-mail ou mot de passe incorrect.' : 'Connexion au serveur impossible. Vérifiez votre réseau, puis réessayez. (' + r.error.message + ')';
      return;
    }
    start(r.data.session);
  });
}

// ---------- Tableau de bord ----------
async function start(session){
  state.session = session;
  var r = await sb.from('profiles').select('full_name,role').eq('id', session.user.id).single();
  state.profile = r.data;
  if(r.error || !r.data || (r.data.role !== 'admin' && r.data.role !== 'editor')){
    app.innerHTML = '<main><div class="card"><h1>Accès refusé</h1><p>Ce compte n’a pas les droits d’administration. Demandez à un administrateur de vous attribuer le rôle éditeur.</p><div class="row"><button id="lo">Se déconnecter</button></div></div></main>';
    document.getElementById('lo').onclick = logout; return;
  }
  app.innerHTML = '<header><div><b>ASC Le Ndiolofène</b><small>Administration · ' + esc(state.profile.role === 'admin' ? 'administrateur' : 'éditeur') + '</small></div><button class="alt" id="lo">Déconnexion</button></header>' +
    '<main><div id="msg" role="status"></div><div class="card"><h2>Actualités</h2><div class="row" style="margin-top:0"><button id="nw">Nouvelle actualité</button></div></div>' +
    '<div id="form"></div><div class="card" id="list"></div>' +
    '<div class="card"><h2>Matchs</h2><div class="row" style="margin-top:0"><button id="nm">Nouveau match</button></div></div><div id="mform"></div><div class="card" id="matchlist"></div>' +
    '<div class="card"><h2>Textes du site</h2><form id="stf">' +
    '<label for="sthist">Historique de l’ASC (affiché dans « L’association »)</label><textarea id="sthist" rows="8" maxlength="8000"></textarea>' +
    '<label for="stcult">Présentation du volet culturel et théâtre</label><textarea id="stcult" rows="4" maxlength="2000"></textarea>' +
    '<div class="row"><button type="submit" id="stsv">Enregistrer les textes</button></div></form></div>' +
    '<div class="card"><h2>Messages reçus</h2><div id="mlist"></div></div></main>';
  document.getElementById('lo').onclick = logout;
  document.getElementById('nw').onclick = function(){ openForm(null); };
  document.getElementById('list').addEventListener('click', onListClick);
  document.getElementById('mlist').addEventListener('click', onMsgClick);
  document.getElementById('nm').onclick = function(){ openMatchForm(null); };
  document.getElementById('matchlist').addEventListener('click', onMatchClick);
  loadNews();
  document.getElementById('stf').addEventListener('submit', saveSettings);
  loadMatches();
  loadSettings();
  loadMessages();
}
async function logout(){ await sb.auth.signOut(); showLogin(); }

async function loadNews(){
  var r = await sb.from('news').select('id,title,category,excerpt,body,cover_url,published,published_at').order('created_at', { ascending:false });
  if(r.error){ toast('Impossible de charger les actualités : ' + r.error.message, true); return; }
  state.items = r.data; renderList();
}
function renderList(){
  var el = document.getElementById('list');
  if(!state.items.length){ el.innerHTML = '<div class="empty">Aucune actualité pour le moment. Touchez « Nouvelle actualité » pour écrire la première.</div>'; return; }
  el.innerHTML = state.items.map(function(n){
    return '<div class="item"><h3>' + esc(n.title) + '</h3><span class="tag' + (n.published ? ' pub' : '') + '">' + (n.published ? 'Publié' : 'Brouillon') + '</span><span class="tag">' + esc(CATS[n.category] || n.category) + '</span>' +
      (n.excerpt ? '<p class="muted" style="margin:.4rem 0 0">' + esc(n.excerpt) + '</p>' : '') +
      '<div class="row" style="margin-top:.6rem"><button class="alt" data-act="edit" data-id="' + n.id + '">Modifier</button>' +
      '<button class="alt" data-act="toggle" data-id="' + n.id + '">' + (n.published ? 'Dépublier' : 'Publier') + '</button>' +
      '<button class="danger" data-act="del" data-id="' + n.id + '">Supprimer</button></div></div>';
  }).join('');
}
function onListClick(e){
  var b = e.target.closest('button[data-act]'); if(!b) return;
  var item = state.items.find(function(x){ return x.id === b.dataset.id; });
  if(!item) return;
  if(b.dataset.act === 'edit') openForm(item);
  if(b.dataset.act === 'toggle') togglePublish(item);
  if(b.dataset.act === 'del') removeItem(item);
}

// ---------- Formulaire ----------
function openForm(item){
  state.editing = item;
  var o = Object.keys(CATS).map(function(k){ return '<option value="' + k + '"' + (item && item.category === k ? ' selected' : '') + '>' + CATS[k] + '</option>'; }).join('');
  var f = document.getElementById('form');
  f.innerHTML = '<div class="card"><h2>' + (item ? 'Modifier l’actualité' : 'Nouvelle actualité') + '</h2><form id="nf">' +
    '<label for="ntitle">Titre</label><input id="ntitle" maxlength="200" required value="' + esc(item ? item.title : '') + '">' +
    '<label for="ncat">Catégorie</label><select id="ncat">' + o + '</select>' +
    '<label for="nexcerpt">Résumé (400 caractères maximum)</label><input id="nexcerpt" maxlength="400" value="' + esc(item ? item.excerpt : '') + '">' +
    '<label for="nbody">Texte</label><textarea id="nbody" rows="8" required>' + esc(item ? item.body : '') + '</textarea>' +
    '<label for="nfile">Photo de couverture (JPEG, PNG ou WebP, 10 Mo maximum)</label><input id="nfile" type="file" accept="image/jpeg,image/png,image/webp">' +
    (item && item.cover_url ? '<img class="cover" alt="Couverture actuelle" src="' + esc(item.cover_url) + '">' : '') +
    '<label><input type="checkbox" id="npub"' + (item && item.published ? ' checked' : '') + '>Publier sur le site</label>' +
    '<div class="row"><button type="submit" id="sv">Enregistrer</button><button type="button" class="alt" id="cn">Annuler</button></div></form></div>';
  document.getElementById('cn').onclick = function(){ f.innerHTML = ''; state.editing = null; };
  document.getElementById('nf').addEventListener('submit', save);
  f.scrollIntoView({ behavior:'smooth', block:'start' });
}
async function save(e){
  e.preventDefault();
  var btn = document.getElementById('sv');
  var title = document.getElementById('ntitle').value.trim(), body = document.getElementById('nbody').value.trim();
  if(title.length < 3){ toast('Le titre doit contenir au moins 3 caractères.', true); return; }
  if(!body){ toast('Écrivez le texte de l’actualité.', true); return; }
  btn.disabled = true;
  var payload = { title: title, category: document.getElementById('ncat').value, excerpt: document.getElementById('nexcerpt').value.trim() || null, body: body, published: document.getElementById('npub').checked };
  var file = document.getElementById('nfile').files[0];
  if(file){
    if(!TYPES[file.type]){ toast('Format d’image non accepté. Utilisez JPEG, PNG ou WebP.', true); btn.disabled = false; return; }
    if(file.size > 10485760){ toast('L’image dépasse 10 Mo.', true); btn.disabled = false; return; }
    var path = 'news/' + Date.now() + '-' + slugify(file.name.replace(/\.[^.]+$/, '')) + '.' + TYPES[file.type];
    var up = await sb.storage.from('media').upload(path, file, { contentType: file.type });
    if(up.error){ toast('Échec de l’envoi de l’image : ' + up.error.message, true); btn.disabled = false; return; }
    payload.cover_url = sb.storage.from('media').getPublicUrl(path).data.publicUrl;
  }
  if(payload.published && !(state.editing && state.editing.published_at)) payload.published_at = new Date().toISOString();
  var r;
  if(state.editing) r = await sb.from('news').update(payload).eq('id', state.editing.id);
  else { payload.slug = slugify(title) + '-' + Date.now().toString(36); payload.author_id = state.session.user.id; r = await sb.from('news').insert(payload); }
  btn.disabled = false;
  if(r.error){ toast('Enregistrement impossible : ' + r.error.message, true); return; }
  document.getElementById('form').innerHTML = ''; state.editing = null;
  toast('Actualité enregistrée.'); loadNews();
}
async function togglePublish(n){
  var p = { published: !n.published };
  if(p.published && !n.published_at) p.published_at = new Date().toISOString();
  var r = await sb.from('news').update(p).eq('id', n.id);
  if(r.error){ toast('Action impossible : ' + r.error.message, true); return; }
  toast(p.published ? 'Actualité publiée.' : 'Actualité dépubliée.'); loadNews();
}
async function removeItem(n){
  if(!window.confirm('Supprimer « ' + n.title + ' » ? Cette action est définitive.')) return;
  var r = await sb.from('news').delete().eq('id', n.id);
  if(r.error){ toast('Suppression impossible : ' + r.error.message, true); return; }
  toast('Actualité supprimée.'); loadNews();
}

// ---------- Matchs ----------
var MATCHES = [], mEditing = null;
var COMPS = ['CNP – Zone 5', 'Phase départementale (ODCAV)', 'Phase régionale (ORCAV)', 'Phase nationale (ONCAV)', 'Coupe du maire', 'Match amical'];
function matchLine(m){
  var a = 'ASC Le Ndiolofène', o = esc(m.opponent), has = m.score_for != null && m.score_against != null;
  if(m.is_home) return has ? a + ' ' + m.score_for + ' – ' + m.score_against + ' ' + o : a + ' vs ' + o;
  return has ? o + ' ' + m.score_against + ' – ' + m.score_for + ' ' + a : o + ' vs ' + a;
}
function toLocalInput(iso){ var d = new Date(iso); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); }
async function loadMatches(){
  var r = await sb.from('matches').select('id,competition,opponent,played_at,venue,is_home,score_for,score_against,report,published').order('played_at', { ascending:false });
  if(r.error){ document.getElementById('matchlist').innerHTML = '<div class="empty">Impossible de charger les matchs : ' + esc(r.error.message) + '</div>'; return; }
  MATCHES = r.data; renderMatches();
}
function renderMatches(){
  var el = document.getElementById('matchlist');
  if(!MATCHES.length){ el.innerHTML = '<div class="empty">Aucun match enregistré. Touchez « Nouveau match » pour ajouter le premier.</div>'; return; }
  el.innerHTML = MATCHES.map(function(m){
    var d = new Date(m.played_at).toLocaleString('fr-FR', { dateStyle:'full', timeStyle:'short' });
    return '<div class="item"><h3>' + matchLine(m) + '</h3><span class="tag' + (m.published ? ' pub' : '') + '">' + (m.published ? 'Publié' : 'Masqué') + '</span><span class="tag">' + esc(m.competition) + '</span><span class="tag">' + (m.is_home ? 'Domicile' : 'Extérieur') + '</span>' +
      '<p class="muted" style="margin:.4rem 0 0">' + esc(d) + (m.venue ? ' · ' + esc(m.venue) : '') + '</p>' +
      '<div class="row" style="margin-top:.6rem"><button class="alt" data-act="medit" data-id="' + m.id + '">Modifier / saisir le score</button>' +
      '<button class="alt" data-act="mtoggle" data-id="' + m.id + '">' + (m.published ? 'Masquer' : 'Publier') + '</button>' +
      '<button class="danger" data-act="mdel" data-id="' + m.id + '">Supprimer</button></div></div>';
  }).join('');
}
function openMatchForm(m){
  mEditing = m;
  var known = m && COMPS.indexOf(m.competition) >= 0;
  var opts = COMPS.map(function(c){ return '<option value="' + esc(c) + '"' + (m && m.competition === c ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') +
    '<option value="__autre"' + (m && !known ? ' selected' : '') + '>Autre (à préciser)</option>';
  var f = document.getElementById('mform');
  f.innerHTML = '<div class="card"><h2>' + (m ? 'Modifier le match' : 'Nouveau match') + '</h2><form id="mf">' +
    '<label for="mcomp">Compétition</label><select id="mcomp">' + opts + '</select>' +
    '<div id="mother" style="display:' + (m && !known ? 'block' : 'none') + '"><label for="mcompo">Nom de la compétition</label><input id="mcompo" maxlength="120" value="' + esc(m && !known ? m.competition : '') + '"></div>' +
    '<label for="mopp">Adversaire</label><input id="mopp" maxlength="120" required value="' + esc(m ? m.opponent : '') + '">' +
    '<label for="mdate">Date et heure</label><input id="mdate" type="datetime-local" required value="' + (m ? toLocalInput(m.played_at) : '') + '">' +
    '<label for="mvenue">Lieu (stade, terrain)</label><input id="mvenue" maxlength="150" value="' + esc(m && m.venue ? m.venue : '') + '">' +
    '<label for="mhome">Le match se joue</label><select id="mhome"><option value="1"' + (!m || m.is_home ? ' selected' : '') + '>À domicile</option><option value="0"' + (m && !m.is_home ? ' selected' : '') + '>À l’extérieur</option></select>' +
    '<label for="msf">Buts de l’ASC Le Ndiolofène (après le match)</label><input id="msf" type="number" min="0" max="99" inputmode="numeric" value="' + (m && m.score_for != null ? m.score_for : '') + '">' +
    '<label for="msa">Buts de l’adversaire (après le match)</label><input id="msa" type="number" min="0" max="99" inputmode="numeric" value="' + (m && m.score_against != null ? m.score_against : '') + '">' +
    '<label for="mreport">Compte rendu (facultatif)</label><textarea id="mreport" rows="5">' + esc(m && m.report ? m.report : '') + '</textarea>' +
    '<label><input type="checkbox" id="mpub"' + (!m || m.published ? ' checked' : '') + '>Afficher sur le site</label>' +
    '<div class="row"><button type="submit" id="msv">Enregistrer</button><button type="button" class="alt" id="mcn">Annuler</button></div></form></div>';
  document.getElementById('mcomp').onchange = function(){ document.getElementById('mother').style.display = this.value === '__autre' ? 'block' : 'none'; };
  document.getElementById('mcn').onclick = function(){ f.innerHTML = ''; mEditing = null; };
  document.getElementById('mf').addEventListener('submit', saveMatch);
  f.scrollIntoView({ behavior:'smooth', block:'start' });
}
async function saveMatch(e){
  e.preventDefault();
  var btn = document.getElementById('msv');
  var comp = document.getElementById('mcomp').value;
  if(comp === '__autre') comp = document.getElementById('mcompo').value.trim();
  var opp = document.getElementById('mopp').value.trim(), dv = document.getElementById('mdate').value;
  var sf = document.getElementById('msf').value.trim(), sa = document.getElementById('msa').value.trim();
  if(!comp){ toast('Indiquez le nom de la compétition.', true); return; }
  if(opp.length < 2){ toast('Indiquez le nom de l’adversaire.', true); return; }
  if(!dv){ toast('Indiquez la date et l’heure du match.', true); return; }
  if((sf === '') !== (sa === '')){ toast('Saisissez les deux scores, ou aucun des deux.', true); return; }
  if(sf !== '' && (!/^\d{1,2}$/.test(sf) || !/^\d{1,2}$/.test(sa))){ toast('Les scores doivent être des nombres entiers.', true); return; }
  btn.disabled = true;
  var payload = { competition: comp, opponent: opp, played_at: new Date(dv).toISOString(), venue: document.getElementById('mvenue').value.trim() || null,
    is_home: document.getElementById('mhome').value === '1', score_for: sf === '' ? null : parseInt(sf, 10), score_against: sa === '' ? null : parseInt(sa, 10),
    report: document.getElementById('mreport').value.trim() || null, published: document.getElementById('mpub').checked };
  var r = mEditing ? await sb.from('matches').update(payload).eq('id', mEditing.id) : await sb.from('matches').insert(payload);
  btn.disabled = false;
  if(r.error){ toast('Enregistrement impossible : ' + r.error.message, true); return; }
  document.getElementById('mform').innerHTML = ''; mEditing = null;
  toast('Match enregistré.'); loadMatches();
}
async function onMatchClick(e){
  var b = e.target.closest('button[data-act]'); if(!b) return;
  var m = MATCHES.find(function(x){ return x.id === b.dataset.id; }); if(!m) return;
  if(b.dataset.act === 'medit') openMatchForm(m);
  if(b.dataset.act === 'mtoggle'){
    var r = await sb.from('matches').update({ published: !m.published }).eq('id', m.id);
    if(r.error){ toast('Action impossible : ' + r.error.message, true); return; }
    toast(m.published ? 'Match masqué.' : 'Match publié.'); loadMatches();
  }
  if(b.dataset.act === 'mdel'){
    if(!window.confirm('Supprimer ce match contre ' + m.opponent + ' ? Cette action est définitive.')) return;
    var d = await sb.from('matches').delete().eq('id', m.id);
    if(d.error){ toast('Suppression impossible : ' + d.error.message, true); return; }
    toast('Match supprimé.'); loadMatches();
  }
}

// ---------- Textes du site ----------
async function loadSettings(){
  var r = await sb.from('site_settings').select('key,value').in('key', ['historique','culture_intro']);
  if(r.error){ toast('Impossible de charger les textes : ' + r.error.message, true); return; }
  r.data.forEach(function(s){
    if(s.key === 'historique') document.getElementById('sthist').value = s.value;
    if(s.key === 'culture_intro') document.getElementById('stcult').value = s.value;
  });
}
async function saveSettings(e){
  e.preventDefault();
  var btn = document.getElementById('stsv'); btn.disabled = true;
  var r = await sb.from('site_settings').upsert([
    { key:'historique', value: document.getElementById('sthist').value.trim() },
    { key:'culture_intro', value: document.getElementById('stcult').value.trim() }
  ], { onConflict:'key' });
  btn.disabled = false;
  if(r.error){ toast('Enregistrement impossible : ' + r.error.message, true); return; }
  toast('Textes enregistrés.');
}

// ---------- Messages reçus ----------
var MSGS = [];
async function loadMessages(){
  var r = await sb.from('messages').select('id,kind,name,email,phone,body,handled,created_at').order('created_at', { ascending:false }).limit(50);
  if(r.error){ document.getElementById('mlist').innerHTML = '<div class="empty">Impossible de charger les messages : ' + esc(r.error.message) + '</div>'; return; }
  MSGS = r.data; renderMessages();
}
function renderMessages(){
  var el = document.getElementById('mlist');
  if(!MSGS.length){ el.innerHTML = '<div class="empty">Aucun message reçu pour le moment.</div>'; return; }
  var isAdmin = state.profile && state.profile.role === 'admin';
  el.innerHTML = MSGS.map(function(m){
    var d = new Date(m.created_at).toLocaleString('fr-FR', { dateStyle:'long', timeStyle:'short' });
    var mail = (m.email && /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m.email)) ? ' · <a href="mailto:' + esc(m.email) + '">' + esc(m.email) + '</a>' : '';
    return '<div class="item"><h3>' + esc(m.name) + '</h3><span class="tag' + (m.handled ? '' : ' pub') + '">' + (m.handled ? 'Traité' : 'Nouveau') + '</span><span class="muted">' + esc(d) + mail + '</span>' +
      '<p style="white-space:pre-line;margin:.5rem 0 0">' + esc(m.body) + '</p>' +
      '<div class="row" style="margin-top:.6rem"><button class="alt" data-act="handled" data-id="' + m.id + '">' + (m.handled ? 'Marquer comme nouveau' : 'Marquer comme traité') + '</button>' +
      (isAdmin ? '<button class="danger" data-act="delmsg" data-id="' + m.id + '">Supprimer</button>' : '') + '</div></div>';
  }).join('');
}
async function onMsgClick(e){
  var b = e.target.closest('button[data-act]'); if(!b) return;
  var m = MSGS.find(function(x){ return x.id === b.dataset.id; }); if(!m) return;
  if(b.dataset.act === 'handled'){
    var r = await sb.from('messages').update({ handled: !m.handled }).eq('id', m.id);
    if(r.error){ toast('Action impossible : ' + r.error.message, true); return; }
    loadMessages();
  }
  if(b.dataset.act === 'delmsg'){
    if(!window.confirm('Supprimer ce message de ' + m.name + ' ? Cette action est définitive.')) return;
    var d = await sb.from('messages').delete().eq('id', m.id);
    if(d.error){ toast('Suppression impossible : ' + d.error.message, true); return; }
    toast('Message supprimé.'); loadMessages();
  }
}

// ---------- Démarrage ----------
sb.auth.getSession().then(function(r){ if(r.data.session) start(r.data.session); else showLogin(); });
</script>
